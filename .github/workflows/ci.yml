name: Esteira de CI - Qualidade de Software

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 (Backend)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Node.js 18 (Frontend e Testes)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Encontrar e buildar o Backend
      run: |
        # Descobre onde está o mvnw
        API_DIR=$(find . -name "mvnw" -exec dirname {} \; | head -1)
        if [ -z "$API_DIR" ]; then
          echo "mvnw nao encontrado!"
          exit 1
        fi
        echo "API_DIR=$API_DIR" >> $GITHUB_ENV
        cd "$API_DIR"
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    - name: Instalar dependencias do Frontend
      run: |
        CLIENT_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -not -path "*/tests/*" | xargs grep -l '"dev"' | head -1 | xargs dirname)
        echo "CLIENT_DIR=$CLIENT_DIR" >> $GITHUB_ENV
        cd "$CLIENT_DIR"
        npm install

    - name: Instalar dependencias do Playwright e Navegadores
      run: |
        TESTS_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" | xargs grep -l '"@playwright/test"' | head -1 | xargs dirname)
        echo "TESTS_DIR=$TESTS_DIR" >> $GITHUB_ENV
        cd "$TESTS_DIR"
        npm install
        npx playwright install --with-deps

    - name: Iniciar Backend em segundo plano
      run: |
        cd "$API_DIR"
        # Força IPv4 no Java para evitar problema de ::1 vs 127.0.0.1
        nohup java -Djava.net.preferIPv4Stack=true -jar target/*.jar > backend.log 2>&1 &
        echo "BACKEND_PID=$!" >> $GITHUB_ENV

    - name: Aguardar Backend estar pronto
      run: |
        echo "Aguardando backend em 127.0.0.1:8080..."
        for i in $(seq 1 30); do
          if curl -s http://127.0.0.1:8080/actuator/health > /dev/null 2>&1; then
            echo "Backend pronto!"
            exit 0
          fi
          # Tenta endpoint raiz também, caso não tenha actuator
          if curl -s http://127.0.0.1:8080/ > /dev/null 2>&1; then
            echo "Backend pronto!"
            exit 0
          fi
          echo "Tentativa $i/30..."
          sleep 5
        done
        echo "Backend nao subiu. Log:"
        cat "$API_DIR/backend.log"
        exit 1

    - name: Iniciar Frontend em segundo plano
      run: |
        cd "$CLIENT_DIR"
        nohup npm run dev > frontend.log 2>&1 &
        echo "FRONTEND_PID=$!" >> $GITHUB_ENV

    - name: Aguardar Frontend estar pronto
      run: |
        echo "Aguardando frontend em 127.0.0.1:3000..."
        for i in $(seq 1 24); do
          if curl -s http://127.0.0.1:3000 > /dev/null 2>&1; then
            echo "Frontend pronto!"
            exit 0
          fi
          echo "Tentativa $i/24..."
          sleep 5
        done
        echo "Frontend nao subiu. Log:"
        cat "$CLIENT_DIR/frontend.log"
        exit 1

    - name: Executar Testes Unitarios do Frontend (Jest)
      run: |
        cd "$CLIENT_DIR"
        npm test -- --watchAll=false || true

    - name: Executar Testes de Integracao e E2E (Playwright)
      run: |
        cd "$TESTS_DIR"
        # Garante que os testes usem 127.0.0.1 e não localhost
        BASE_URL=http://127.0.0.1:3000 API_URL=http://127.0.0.1:8080 npx playwright test

    - name: Salvar logs em caso de falha
      if: failure()
      run: |
        echo "=== BACKEND LOG ===" && cat "$API_DIR/backend.log" || true
        echo "=== FRONTEND LOG ===" && cat "$CLIENT_DIR/frontend.log" || true

    - name: Upload do relatorio do Playwright
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: "**/playwright-report/"
        retention-days: 7