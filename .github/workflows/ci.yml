name: Esteira de CI - Qualidade de Software

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: social_media_db
          MYSQL_USER: dev_user
          MYSQL_PASSWORD: dev_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Forcar resolucao de localhost para IPv4 (Evita erro de IPv6 no Playwright)
      run: |
        sudo sed -i 's/^::1\s*localhost/##::1 localhost/' /etc/hosts

    - name: Configurar Java 17 (Backend)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Node.js 18 (Frontend e Testes)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Instalar dependencias e buildar o Backend (API)
      run: |
        cd sqa-social-media-main/api || cd api || cd .
        if [ -f "mvnw" ]; then
          chmod +x mvnw
          ./mvnw clean package -DskipTests
        else
          mvn clean package -DskipTests
        fi

    - name: Instalar dependencias do Frontend (Client)
      run: |
        cd sqa-social-media-main/client || cd client || cd .
        npm install

    - name: Instalar dependencias do Playwright e Navegadores
      run: |
        cd sqa-social-media-main/tests || cd tests || cd .
        npm install
        npx playwright install --with-deps

    - name: Inicializar a API Backend em Segundo Plano
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/social_media_db?allowPublicKeyRetrieval=true&useSSL=false
        SPRING_DATASOURCE_USERNAME: dev_user
        SPRING_DATASOURCE_PASSWORD: dev_password
      run: |
        cd sqa-social-media-main/api || cd api || cd .
        nohup java -Djava.net.preferIPv4Stack=true -jar target/*.jar > backend.log 2>&1 &

    - name: Inicializar o Frontend em Segundo Plano
      run: |
        cd sqa-social-media-main/client || cd client || cd .
        nohup npm run dev > frontend.log 2>&1 &

    - name: Aguardar inicializacao dos Servicos pelas portas TCP (wait-on)
      run: |
        npx wait-on tcp:127.0.0.1:8080 tcp:127.0.0.1:3000 --timeout 120000

    - name: Executar Testes Unitarios do Frontend (Jest)
      run: |
        cd sqa-social-media-main/client || cd client || cd .
        npm test -- --watchAll=false || true

    - name: Executar Testes de Integracao e E2E (Playwright)
      run: |
        cd sqa-social-media-main/tests || cd tests || cd .
        npx playwright test

    - name: Exibir logs do Backend em caso de falha (Debug)
      if: failure()
      run: |
        echo "=== LOGS DO BACKEND ==="
        cat sqa-social-media-main/api/backend.log || true